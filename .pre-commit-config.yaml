repos:
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        description: run cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        args: ["--all"]
        pass_filenames: false
      - id: generate-schema-json
        name: generate schema.json
        description: regenerate schema.json from schema_json_gen
        entry: cargo run --package schema_json_gen --bin schema_json_gen
        language: system
        files: ^tools/schema_json_gen/src/main\.rs$
        pass_filenames: false
      - id: std-i18n
        name: regenerate std i18n resources
        description: regenerate tools/std_i18n data and resources/std-zh_CN
        entry: cargo run --package std_i18n
        language: system
        files: ^(crates/emmylua_code_analysis/resources/std/|tools/std_i18n/)
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: prettier
        args: [--write, --ignore-unknown]
        language: node
        types: [text]
        additional_dependencies:
          - prettier@3.9.6
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tools/std_i18n/data/.*\.yaml$'
      - id: end-of-file-fixer
        exclude: '^tools/std_i18n/data/.*\.yaml$'
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [manual]
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^.vscode/
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude_types: [rust]
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-vcs-permalinks
  - repo: https://github.com/crate-ci/typos
    rev: master
    hooks:
      - id: typos
