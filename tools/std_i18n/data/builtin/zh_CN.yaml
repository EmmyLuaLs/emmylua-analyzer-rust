nil: |
  *nil* 类型只有一个值 **nil**，其主要特性是与任何其他值都不同；
  它通常表示缺少有用的值。

boolean: |
  *boolean* 类型有两个值：**false** 和 **true**。**nil** 和 **false**
  都会使条件为假；任何其他值都会使条件为真。

number: |
  **number** 类型在内部使用两种表示形式，或称为两种子类型，一种叫做
  *integer*，另一种叫做 *float*。Lua 对于何时使用哪种表示形式有明确的规则，
  但也会在需要时自动进行转换。因此，程序员可以选择忽略整数和浮点数之间的差异，
  也可以完全控制每个数字的表示形式。标准 Lua 使用 64 位整数和双精度（64 位）
  浮点数，但你也可以将 Lua 编译为使用 32 位整数和/或单精度（32 位）浮点数。
  对于小型机器和嵌入式系统来说，同时使用 32 位整数和 32 位浮点数的选项特别有吸引力。
  （参见 `luaconf.h` 文件中的宏 `LUA_32BITS`。）

integer: |
  *number* 的子类型，用于表示整数值（Lua 5.3+）。在类型注解中，integer 可以赋值给
  number，但 number 不能赋值给 integer。

userdata: |
  *userdata* 类型用于允许将任意 C 数据存储在 Lua 变量中。userdata 值
  表示一块原始内存。有两种 userdata：*full userdata*，是一个由 Lua
  管理内存块的对象；*light userdata*，它仅是一个 C 指针值。userdata 在
  Lua 中没有预定义的操作，除了赋值和相等性测试。通过使用 *metatables*，程序员
  可以为 full userdata 值定义操作。userdata 值不能在 Lua 中创建或修改，
  只能通过 C API 进行。这保证了宿主程序所拥有数据的完整性。

lightuserdata: |
  *lightuserdata* 类型保存一个裸 C 指针。在 Lua 中它和 *userdata* 一样只支持赋值和
  相等比较，例如 `debug.upvalueid` 会返回这种值。

thread: |
  *thread* 类型表示独立的执行线程，用于实现协程。Lua 线程与操作系统
  线程无关。Lua 在所有系统上都支持协程，即使是那些原生不支持线程的系统。

table: |
  *table* 类型实现关联数组，即索引不仅可以是数字，还可以是除 **nil**
  和 NaN 之外的任何 Lua 值的数组。（*NaN* 是 IEEE 754 标准用于表示
  未定义或不可表示的数值结果的特殊浮点值，例如 `0/0`。）表可以是异构的；
  也就是说，它们可以包含所有类型的值（除了 **nil**）。值为 **nil** 的
  任何键都不被视为表的一部分。相反，任何不属于表的键其关联值都为 **nil**。

  表是 Lua 中唯一的数据结构；它们可以用来表示普通数组、列表、符号表、
  集合、记录、图、树等。为了表示记录，Lua 使用字段名作为索引。语言通过
  提供 `a.name` 作为 `a["name"]` 的语法糖来支持这种表示。

  与索引一样，表字段的值可以是任何类型。特别地，由于函数是一等公民，表
  字段可以包含函数。因此表也可以携带 *methods*。

  表的索引遵循语言中原始相等的定义。表达式 `a[i]` 和 `a[j]` 当且仅当
  `i` 和 `j` 原始相等（即不使用元方法的相等）时表示相同的表元素。特别地，
  具有整数值的浮点数等于其对应的整数。为避免歧义，任何用作键的具有整数值
  的浮点数都会转换为其对应的整数。例如，如果你写 `a[2.0] = true`，
  插入表中的实际键将是整数 `2`。（另一方面，`2` 和 `"2"` 是不同的 Lua 值，
  因此表示不同的表条目。）

any: |
  *any* 类型会关闭类型检查：任何值都可以赋值给 `any`，`any` 也可以赋值给任何类型。

void: |
  *void* 类型表示没有返回值。分析器会将它投影为 `nil`，因此
  `fun(): void` 等价于 `fun(): nil`。

unknown: |
  *unknown* 类型用于无法推断出类型的情况。它和 `any` 一样与所有类型兼容，
  但同时表示推断失败。对于有意不检查的值，请优先使用 `any`。

never: |
  *never* 是底类型：它可以赋值给任何类型，但没有任何值可以赋值给它。主要用于条件类型
  的结果，例如 `Exclude` 条件为真时、`Extract` 条件为假时。

self: |
  方法内部隐式 `self` 参数的类型，会被替换为所属类的实例；在方法外使用没有意义。

int: |
  `integer` 的别名，保留用于 C 风格的注解。

namespace: |
  用于命名空间限定类型的保留类型名。命名空间通过 `---@namespace` 标签声明；
  这个类只是避免 `namespace<"...">` 被解析为未知类型。

function: |
  原始 *function* 类型的保留名称。`@type function` 会解析为内建的函数类型，
  而不是这个类。

std.NotNull: |
  从 `T` 中移除 `nil`；等价于 `Exclude<T, nil>`。

std.Nullable: |
  为 `T` 添加 `nil`；等价于 `T | nil`。

std.Select: |
  `select` 返回值元组的标记类型。分析器会直接计算 `select` 调用；`unknown`
  只是占位符。

std.Unpack: |
  `table.unpack`/`unpack` 多个返回值的标记类型。分析器会展开元组 `T` 的所有值；
  `Start` 和 `End` 暂时保留，尚未生效。

std.RawGet: |
  `rawget(T, K)` 的标记类型：`T` 中键 `K` 对应的值类型。

TypeGuard: |
  自定义类型守卫。标注 `---@return TypeGuard<T>` 的函数会在真值分支中把参数
  窄化为 `T`。

Language: |
  标记包含 `T` 语言源代码的字符串参数（例如 `load`/`loadstring` 的代码块参数可
  标记为 `Language<"Lua">`）。分析器目前会将它投影为 `string`，因此不会应用
  内嵌语言高亮。

Parameters: |
  以元组形式获取函数的参数

ConstructorParameters: |
  以元组形式获取构造函数的参数

ReturnType: |
  获取函数类型的返回类型

Partial: |
  使 T 中的所有属性变为可选

Exclude: |
  排除 T 中可以赋值给 U 的类型

Extract: |
  提取 T 中可以赋值给 U 的类型

Attribute: |
  通过 `---@[...]` 语法应用的内建特性的基类。

deprecated: |
  将声明标记为已弃用。可以接收一个可选消息。

  既支持传统的 `---@deprecated` 标签，也支持 `---@[deprecated("message")]` 形式。

lsp_optimization: |
  语言服务器优化项。

  ### 参数

  - `delayed_definition`: 表示变量类型由第一次赋值决定，仅对没有初始值的 `local` 声明有效。

index_alias: |
  整数索引字段（例如 `---@field [1] string`）的别名。别名会代替原始索引显示在
  inlay hint 和补全中。

  接收一个字符串参数作为别名名称。

constructor: |
  用于指定工厂函数所创建类的默认构造函数。
  此属性必须应用于函数参数，并紧邻对应的 `---@param` 标签；参数类型必须是
  字符串模板泛型。

  ### 参数

  - `name`: 作为构造函数的方法名（必填）。
  - `root_class`: 为兼容 LuaLS 保留；当前分析器接受该参数，但不会添加隐式继承。默认为空。
  - `strip_self`: 调用构造函数时是否可以省略 `self` 参数，默认为 `true`。
  - `return_mode`: 构造函数返回策略。`"self"` 返回类实例，`"doc"` 使用构造函数注解的返回类型，
    `"default"` 优先使用注解的返回类型，并在没有声明注解时回退到实例类型。默认为 `"default"`。

field_accessor: |
  将 `getter` 和 `setter` 方法与字段关联。目前仅提供定义跳转功能：
  跳转到字段时也会跳转到该字段所属类上匹配的访问器方法。

  该属性作用于其后的 `@field` 标签；放在 `@class` 之前时会作用于第一个字段。

  ### 参数

  - `convention`: 生成访问器名称的命名约定。将 `get`/`set` 前缀与字段名组合，
    默认为 `camelCase`（`_age` -> `getAge`、`setAge`；`first_name` -> `getFirstName`、
    `setFirstName`）。`"PascalCase"` 生成 `GetAge`/`SetAge`，`"snake_case"` 生成
    `get_age`/`set_age`。
  - `getter`: Getter 方法名。优先级高于 `convention`。
  - `setter`: Setter 方法名。优先级高于 `convention`。

